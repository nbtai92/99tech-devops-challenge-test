# Reusable: deploy one frontend version (by git SHA) to one environment.
#
# Environment variables come from the GitHub Environment (Settings -> Environments):
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ARTIFACT_BUCKET,
#   SITE_BUCKET, CLOUDFRONT_DISTRIBUTION_ID, FRONTEND_URL, BACKEND_URL
name: deploy-frontend

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      version:
        description: "Git SHA of the release"
        type: string
        required: true
      mode:
        description: >-
          release: publish the bundle built in this run; skip if a newer version is already live.
          rollback: deploy a bundle already in this environment's artifact bucket, even if it is older.
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: S3 + CloudFront (${{ inputs.environment }}, ${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.FRONTEND_URL }}
    # Same policy as the backend: serialized per environment, latest pending candidate wins,
    # release guard handles runs that finish out of order.
    concurrency:
      group: frontend-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      KEY: frontend/${{ inputs.version }}.tgz
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$VERSION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::version must be a full 40-char git SHA"; exit 1; }
          [[ "$MODE" == release || "$MODE" == rollback ]] || { echo "::error::mode must be release or rollback"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download bundle from this run
        if: inputs.mode == 'release'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-${{ inputs.version }}
          path: bundle

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-frontend-${{ inputs.environment }}-${{ github.run_id }}

      - name: Release guard (never replace a newer version)
        id: guard
        run: |
          if [ "$MODE" = rollback ]; then
            echo "decision=deploy" >> "$GITHUB_OUTPUT"; echo "rollback: guard bypassed"; exit 0
          fi
          current=$(aws s3 cp "s3://$SITE_BUCKET/config.json" - 2>/dev/null | jq -r '.version // empty' || true)
          echo "currently live: ${current:-none}"
          echo "decision=$(src/problem4/ci/release-guard.sh "$VERSION" "$current")" >> "$GITHUB_OUTPUT"

      - name: Skipped (newer version already live)
        if: steps.guard.outputs.decision == 'skip'
        run: |
          echo "::notice::Skipped ${VERSION}: a newer version is already live in ${{ inputs.environment }}."

      - name: Publish bundle to S3 (immutable, one object per SHA)
        if: inputs.mode == 'release' && steps.guard.outputs.decision == 'deploy'
        run: |
          if aws s3api head-object --bucket "$ARTIFACT_BUCKET" --key "$KEY" >/dev/null 2>&1; then
            echo "s3://$ARTIFACT_BUCKET/$KEY already exists, not overwriting"
          else
            aws s3 cp "bundle/frontend-${VERSION}.tgz" "s3://$ARTIFACT_BUCKET/$KEY" --only-show-errors
          fi

      # Same code path for releases and rollbacks: always deploy what is in S3.
      - name: Fetch and unpack release
        if: steps.guard.outputs.decision == 'deploy'
        run: |
          aws s3 cp "s3://$ARTIFACT_BUCKET/$KEY" release.tgz --only-show-errors || {
            echo "::error::s3://$ARTIFACT_BUCKET/$KEY not found. Only versions previously released to ${{ inputs.environment }} can be rolled back to."
            exit 1; }
          mkdir site && tar -xzf release.tgz -C site
          grep -q "content=\"${VERSION}\"" site/index.html \
            || { echo "::error::bundle does not contain version ${VERSION}"; exit 1; }

      # Order matters: new assets first, index.html last, so a user never gets an
      # index.html that points at assets that are not uploaded yet.
      - name: Upload hashed assets (cached for a year)
        if: steps.guard.outputs.decision == 'deploy'
        run: |
          aws s3 sync site/assets "s3://$SITE_BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable" --only-show-errors
          # No --delete: old assets stay for users with an older index.html open.

      - name: Upload runtime config
        if: steps.guard.outputs.decision == 'deploy'
        env:
          API_BASE_URL: ${{ vars.BACKEND_URL }}
        run: |
          jq -n --arg api "$API_BASE_URL" --arg v "$VERSION" '{apiBaseUrl: $api, version: $v}' > config.json
          aws s3 cp config.json "s3://$SITE_BUCKET/config.json" \
            --cache-control "no-cache" --content-type "application/json" --only-show-errors

      - name: Upload index.html (never cached)
        if: steps.guard.outputs.decision == 'deploy'
        run: |
          aws s3 cp site/index.html "s3://$SITE_BUCKET/index.html" \
            --cache-control "no-cache" --content-type "text/html; charset=utf-8" --only-show-errors

      - name: Invalidate CloudFront
        if: steps.guard.outputs.decision == 'deploy'
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          # Only the un-hashed files need invalidating; hashed assets have new names.
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" "/config.json" "/" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: Smoke test
        if: steps.guard.outputs.decision == 'deploy'
        env:
          URL: ${{ vars.FRONTEND_URL }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS --max-time 5 "$URL/" | grep -q "content=\"${VERSION}\""; then
              echo "OK: $URL serves ${VERSION}"; exit 0
            fi
            echo "attempt $i: ${VERSION} not live yet"; sleep 6
          done
          echo "::error::$URL is not serving ${VERSION}. Roll back manually: run the 'frontend' workflow with mode rollback."
          exit 1

      # The page loading is not enough: the browser must also be allowed to call the API.
      - name: Integration check (frontend origin can call the API)
        if: steps.guard.outputs.decision == 'deploy'
        run: src/problem4/ci/check-cors.sh "${{ vars.BACKEND_URL }}" "${{ vars.FRONTEND_URL }}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Frontend → ${{ inputs.environment }} (${MODE})"
            echo "- Version: \`${VERSION}\`"
            echo "- Decision: ${{ steps.guard.outputs.decision || 'n/a' }}"
            echo "- Bundle: \`s3://${ARTIFACT_BUCKET}/${KEY}\`"
            echo "- Site bucket: \`s3://${SITE_BUCKET}\`"
            echo "- Result: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
