# Log upstream timings so slow or failing upstream calls are visible.
log_format upstream_timing '$remote_addr [$time_local] "$request" $status '
                           'rt=$request_time uct=$upstream_connect_time '
                           'urt=$upstream_response_time ua="$upstream_addr"';

server {
    listen 80;

    access_log /var/log/nginx/access.log upstream_timing;

    # Docker's embedded DNS. Re-resolve "api" every 10s instead of caching the
    # container IP forever (the IP changes when the api container is recreated).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    proxy_connect_timeout 2s;
    proxy_read_timeout    10s;
    proxy_send_timeout    10s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        proxy_pass $api_upstream;
    }

    # API liveness, exposed for external uptime checks.
    location = /status {
        proxy_pass $api_upstream;
    }
}
